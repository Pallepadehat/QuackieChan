name: QuackieChan
options:
  bundleIdPrefix: com.jakobsendevelopment.quackiechan
  xcodeVersion: "27.0"
  projectFormat: xcode16_0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode's recommended settings.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    MARKETING_VERSION: "0.3.0"
    # Sparkle compares build numbers, so they go up with the version.
    CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
packages:
  # Runs the vision model on the Mac's GPU.
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  # Downloads the model from Hugging Face and reads its tokenizer.
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
  # Updates: finds new releases on GitHub and installs them.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

schemes:
  QuackieChan:
    build:
      targets:
        QuackieChan: all
        QuackieChanTests: [test]
    run:
      config: Debug
      # MLX trips Metal's debug validation on harmless empty buffers, which stops the app when run from Xcode.
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
    test:
      config: Debug
      targets: [QuackieChanTests]
    profile:
      config: Release
    archive:
      config: Release

targets:
  QuackieChan:
    type: application
    platform: macOS
    sources:
      - path: QuackieChan
    dependencies:
      - package: MLXSwift
        product: MLX
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
      - package: Sparkle
    info:
      path: QuackieChan/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where Sparkle looks for new versions: the appcast attached to the latest GitHub release.
        SUFeedURL: https://github.com/Pallepadehat/QuackieChan/releases/latest/download/appcast.xml
        # The public half of the key releases are signed with (the private half is in the maintainer's keychain).
        SUPublicEDKey: mHeNSUPTLt12nikqiH5D0uBl7MAlnOd8ZaennsPfpLo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: Quackie Chan
        PRODUCT_MODULE_NAME: QuackieChan
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobsendevelopment.quackiechan
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quackie Chan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Patrick Jakobsen. MIT License.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: The duck asks your browser which page you're on (so it knows when you're shopping or doomscrolling) and your music app what's playing (so it can dance). Nothing leaves your Mac.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to the duck. What you say is turned into text on your Mac and never leaves it.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Talk to the duck. Speech is recognised on your Mac and never leaves it.
        # The duck needs to look at other apps' windows and ask browsers for their address,
        # which the App Sandbox doesn't allow.
        ENABLE_APP_SANDBOX: NO
        # Apple's notarization needs the hardened runtime; the entitlements let AppleScript and the microphone through.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuackieChan/QuackieChan.entitlements

  QuackieChanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuackieChanTests
    dependencies:
      - target: QuackieChan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakobsendevelopment.quackiechan.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quackie Chan.app/Contents/MacOS/Quackie Chan"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 537P4FPMZ4
